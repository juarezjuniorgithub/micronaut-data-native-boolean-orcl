micronaut.application.name=micronaut-data-native-boolean-orcl
micronaut.server.port=8080
micronaut.views.thymeleaf.enabled=true
micronaut.views.folder=views
micronaut.router.static-resources.default.mapping=/**
micronaut.router.static-resources.default.paths=classpath:static

# Credentials stay outside source control. DB_URL should be a standard Oracle JDBC URL.
datasources.default.url=${DB_URL}
datasources.default.username=${DB_USERNAME}
datasources.default.password=${DB_PASSWORD}
datasources.default.driver-class-name=oracle.jdbc.OracleDriver
datasources.default.db-type=oracle
datasources.default.dialect=ORACLE
# Schema generation is runtime work, so it needs its own target-version setting.
datasources.default.dialect-options.version=23.1
datasources.default.schema-generate=CREATE_DROP

# Observability: only native Oracle BOOLEAN operations create application trace spans and console events.
micronaut.otel.enabled=true
otel.service.name=micronaut-data-native-boolean-orcl
otel.resource.attributes=deployment.environment=local,oracle.boolean.mapping=native
# The logging exporter is intentionally local: it prints spans to the application console and sends nothing remotely.
otel.traces.exporter=logging
otel.metrics.exporter=none
otel.logs.exporter=none

# Suppresses Micronaut Data schema and generic SQL output; NativeBooleanObservability emits focused BOOLEAN events.
logger.levels.io.micronaut.oracle.dev=DEBUG
logger.levels.io.micronaut.data.query=ERROR
